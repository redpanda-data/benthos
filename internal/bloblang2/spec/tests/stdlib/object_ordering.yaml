description: >
  Canonical object key ordering (Section 2.3): everywhere keys are
  enumerated — iteration methods, lambda object methods, and JSON
  serialization — objects walk their keys in ascending Unicode CODEPOINT
  order. Object EQUALITY remains order-independent. These tests compare
  arrays and strings, which are order-sensitive, so they pin the canonical
  order exactly.

tests:
  # --- Iteration methods return ascending key order ---

  - name: "keys returns ascending key order"
    mapping: |
      output = {"b": 1, "a": 2, "c": 3}.keys()
    output: ["a", "b", "c"]

  - name: "values returns values in ascending key order"
    mapping: |
      output = {"b": 1, "a": 2, "c": 3}.values()
    output: [2, 1, 3]

  - name: "iter returns entries in ascending key order"
    mapping: |
      output = {"b": 1, "a": 2}.iter()
    output: [{"key": "a", "value": 2}, {"key": "b", "value": 1}]

  # --- Key order is by Unicode codepoint, not UTF-16 code unit ---
  # U+E000 (private use, one code unit) sorts BEFORE U+1F600 (emoji,
  # surrogate pair) in codepoint order; code-unit comparison reverses them.

  - name: "keys sort by codepoint for astral-plane keys"
    mapping: |
      output = {"😀": 1, "\uE000": 2}.keys()
    output: ["\uE000", "😀"]

  - name: "string comparison operators use codepoint order"
    mapping: |
      output.lt = "\uE000" < "😀"
      output.gt = "😀" > "\uE000"
    output: {"lt": true, "gt": true}

  - name: "sort orders strings by codepoint"
    mapping: |
      output = ["😀", "\uE000", "a"].sort()
    output: ["a", "\uE000", "😀"]

  # --- Serialization uses ascending key order (exact string comparison) ---

  - name: "format_json serializes keys in ascending order"
    mapping: |
      output = {"b": 1, "a": 2, "c": 3}.format_json()
    output: '{"a":2,"b":1,"c":3}'

  - name: "format_json sorts nested object keys"
    mapping: |
      output = {"z": {"y": 1, "x": 2}, "a": 0}.format_json()
    output: '{"a":0,"z":{"x":2,"y":1}}'

  - name: "string conversion serializes keys in ascending order"
    mapping: |
      output = {"b": 1, "a": 2}.string()
    output: '{"a":2,"b":1}'

  - name: "string conversion does not escape html"
    mapping: |
      output = {"h": "<b>&</b>"}.string()
    output: '{"h":"<b>&</b>"}'

  # --- Lambda object methods iterate in ascending key order ---

  - name: "map_entries transforms entries and result iterates in key order"
    mapping: |
      output = {"b": 1, "a": 2}.map_entries((k, v) -> {"key": k.uppercase(), "value": v * 10}).keys()
    output: ["A", "B"]

  # --- Key collisions: last value wins, in canonical order (I-3) ---
  # Iteration is ascending key order, so the value from the
  # lexicographically-LARGEST colliding source key wins.

  - name: "map_keys collision last value wins by key order"
    mapping: |
      output = {"a": "first", "z": "last"}.map_keys(k -> "same")
    output: {"same": "last"}

  - name: "map_keys collision independent of literal insertion order"
    mapping: |
      output = {"z": "last", "a": "first"}.map_keys(k -> "same")
    output: {"same": "last"}

  - name: "map_entries collision last value wins by key order"
    mapping: |
      output = {"b": 10, "a": 20}.map_entries((k, v) -> {"key": "x", "value": v})
    output: {"x": 10}

  # --- Integer-like keys still sort by codepoint (not numerically) ---

  - name: "integer-like keys serialize in codepoint order"
    mapping: |
      output = {"10": 1, "2": 2, "a": 3}.format_json()
    output: '{"10":1,"2":2,"a":3}'

  - name: "integer-like keys string conversion in codepoint order"
    mapping: |
      output = {"10": 1, "2": 2}.string()
    output: '{"10":1,"2":2}'

  # --- Serialization applies recursively inside arrays ---

  - name: "string conversion sorts object keys nested in arrays"
    mapping: |
      output = [{"b": 1, "a": 2}].string()
    output: '[{"a":2,"b":1}]'

  # --- Timestamps in containers serialize as shortest-precision RFC 3339 ---

  - name: "timestamp in object via string conversion"
    mapping: |
      output = {"t": 0.ts_from_unix()}.string()
    output: '{"t":"1970-01-01T00:00:00Z"}'

  - name: "timestamp with nanoseconds in object via string conversion"
    mapping: |
      output = {"t": 0.ts_from_unix().ts_add(1)}.string()
    output: '{"t":"1970-01-01T00:00:00.000000001Z"}'

  # --- Metadata objects follow canonical enumeration order ---

  - name: "metadata keys in ascending order"
    input_metadata: {"b": "2", "a": "1", "c": "3"}
    mapping: |
      output = input@.keys()
    output: ["a", "b", "c"]

  - name: "metadata iter in ascending order"
    input_metadata: {"b": "2", "a": "1"}
    mapping: |
      output = input@.iter()
    output: [{"key": "a", "value": "1"}, {"key": "b", "value": "2"}]
